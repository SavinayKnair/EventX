{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5 mb-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header text-center border-0 py-4" style="background: var(--primary-gradient); color: white;">
                <h3 class="fw-bold mb-0">Welcome Back</h3>
                <p class="mb-0 text-white-50">Sign in to your EventX account</p>
            </div>
            <div class="card-body p-5">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light border-0" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="Enter your password" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-premium btn-lg">Sign In</button>
                    </div>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Create one</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
